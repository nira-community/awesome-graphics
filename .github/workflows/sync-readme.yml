name: Sync README from Gist

on:
  schedule:
    - cron: "0 0 * * *"    # daily safety net, midnight UTC
  workflow_dispatch:                      # manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch gist content
        env:
          GH_TOKEN: ${{ secrets.GIST_PAT }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/gists/ceef71527b4f15869133ba7b397912e9" \
            -o gist_response.json -w "HTTP status: %{http_code}\n"

          jq -r '.files["cgp.md"].content' gist_response.json > README.md

      - name: Verify README is not empty
        run: |
          if [ ! -s README.md ] || grep -q "^null$" README.md; then
            echo "::error::README.md is empty or null — aborting commit"
            cat gist_response.json
            exit 1
          fi

      - name: Commit if changed
        run: |
          git config user.name "gist-sync-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "sync README from gist"
            git push
          else
            echo "No changes to README.md"
          fi